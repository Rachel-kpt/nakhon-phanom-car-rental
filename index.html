<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองเช่ารถ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sarabun', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --primary: #3b82f6;
      --secondary: #0ea5e9;
    }
    body { font-family: 'Sarabun', sans-serif; }
    .btn-primary { background-color: var(--primary); }
    .btn-primary:hover { filter: brightness(1.1); }
    .text-primary { color: var(--primary); }
    .border-primary { border-color: var(--primary); }
    .bg-primary { background-color: var(--primary); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
  <div id="app"></div>

  <script>
    // Default data
    const defaultSettings = {
      companyName: "เช่ารถอุดรธานี",
      slogan: "บริการเช่ารถคุณภาพ ราคาเป็นมิตร",
      about: "เรามีรถให้เลือกหลากหลายรุ่น สะอาด ปลอดภัย พร้อมบริการตลอด 24 ชั่วโมง",
      primaryColor: "#3b82f6",
      secondaryColor: "#0ea5e9",
      ownerWhatsApp: "0812345678",
      ownerLine: "owner_line_id",
      logoUrl: "https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=200&h=200&fit=crop",
      contactPhone: "042-123-456",
      contactEmail: "info@carrental.com"
    };

    const defaultCars = [
      {
        id: 1,
        name: "Toyota Camry",
        type: "ซีดาน",
        price: 1200,
        image: "https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=600&h=400&fit=crop",
        description: "รถซีดานหรู สะดวกสบาย เหมาะสำหรับท่องเที่ยว",
        seats: 5,
        available: true
      },
      {
        id: 2,
        name: "Honda Civic",
        type: "ซีดาน",
        price: 1000,
        image: "https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?w=600&h=400&fit=crop",
        description: "ประหยัดน้ำมัน ขับขี่คล่องตัว",
        seats: 5,
        available: true
      },
      {
        id: 3,
        name: "Toyota Fortuner",
        type: "SUV",
        price: 1800,
        image: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=600&h=400&fit=crop",
        description: "รถ SUV แข็งแรง เหมาะสำหรับครอบครัวและทางไกล",
        seats: 7,
        available: true
      },
      {
        id: 4,
        name: "Mazda CX-5",
        type: "SUV",
        price: 1600,
        image: "https://images.unsplash.com/photo-1609521263047-f8f205293f24?w=600&h=400&fit=crop",
        description: "ดีไซน์สวย ทันสมัย ระบบความปลอดภัยครบครัน",
        seats: 5,
        available: true
      }
    ];

    // State
    let settings = JSON.parse(localStorage.getItem('settings')) || defaultSettings;
    let cars = JSON.parse(localStorage.getItem('cars')) || defaultCars;
    let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

    function saveData() {
      localStorage.setItem('settings', JSON.stringify(settings));
      localStorage.setItem('cars', JSON.stringify(cars));
      localStorage.setItem('bookings', JSON.stringify(bookings));
    }

    function applyTheme() {
      document.documentElement.style.setProperty('--primary', settings.primaryColor);
      document.documentElement.style.setProperty('--secondary', settings.secondaryColor);
    }

    function formatPrice(price) {
      return price.toLocaleString('th-TH') + ' บาท/วัน';
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function calculateDays(start, end) {
      const startDate = new Date(start);
      const endDate = new Date(end);
      const diff = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));
      return diff > 0 ? diff : 1;
    }

    function generateNotifyMessage(booking, car) {
      const days = calculateDays(booking.startDate, booking.endDate);
      const total = days * car.price;
      return `🚗 การจองเช่ารถใหม่!\n\nลูกค้า: ${booking.name}\nเบอร์โทร: ${booking.phone}\nรถ: ${car.name}\nวันที่รับ: ${formatDate(booking.startDate)}\nวันที่คืน: ${formatDate(booking.endDate)}\nจำนวนวัน: ${days} วัน\nราคารวม: ${total.toLocaleString('th-TH')} บาท\nหมายเหตุ: ${booking.note || '-'}`;
    }

    function getLineLink(message) {
      return `https://line.me/R/msg/text/?${encodeURIComponent(message)}`;
    }

    function getWhatsAppLink(phone, message) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      const thaiPhone = cleanPhone.startsWith('0') ? '66' + cleanPhone.slice(1) : cleanPhone;
      return `https://wa.me/${thaiPhone}?text=${encodeURIComponent(message)}`;
    }

    // Render functions
    function renderApp() {
      applyTheme();
      const availableCars = cars.filter(c => c.available);
      
      document.getElementById('app').innerHTML = `
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
          <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <img src="${settings.logoUrl}" alt="Logo" class="w-12 h-12 rounded-full object-cover border-2 border-primary">
              <div>
                <h1 class="text-xl font-bold text-gray-800">${settings.companyName}</h1>
                <p class="text-sm text-gray-500">${settings.slogan}</p>
              </div>
            </div>
            <a href="admin.html" class="text-sm text-gray-600 hover:text-primary transition">เข้าสู่ระบบแอดมิน</a>
          </div>
        </header>

        <!-- Hero -->
        <section class="relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-r from-primary/10 to-secondary/10"></div>
          <div class="max-w-7xl mx-auto px-4 py-16 relative">
            <div class="text-center max-w-2xl mx-auto">
              <h2 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">จองเช่ารถง่ายๆ<br>ในไม่กี่คลิก</h2>
              <p class="text-lg text-gray-600 mb-8">${settings.about}</p>
              <div class="flex flex-wrap justify-center gap-4 text-sm">
                <div class="bg-white px-4 py-2 rounded-full shadow-sm">📞 ${settings.contactPhone}</div>
                <div class="bg-white px-4 py-2 rounded-full shadow-sm">✉️ ${settings.contactEmail}</div>
              </div>
            </div>
          </div>
        </section>

        <!-- Cars -->
        <section class="max-w-7xl mx-auto px-4 py-12">
          <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">รถพร้อมให้เช่า</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cars-grid">
            ${availableCars.map(car => `
              <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                <img src="${car.image}" alt="${car.name}" class="w-full h-48 object-cover">
                <div class="p-5">
                  <div class="flex justify-between items-start mb-2">
                    <h4 class="text-lg font-semibold text-gray-800">${car.name}</h4>
                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full">${car.type}</span>
                  </div>
                  <p class="text-sm text-gray-500 mb-3 line-clamp-2">${car.description}</p>
                  <div class="flex items-center justify-between mb-4">
                    <span class="text-xs text-gray-400">🪑 ${car.seats} ที่นั่ง</span>
                    <span class="text-xl font-bold text-primary">${formatPrice(car.price)}</span>
                  </div>
                  <button onclick="openBooking(${car.id})" class="w-full btn-primary text-white py-2.5 rounded-xl font-medium transition">
                    จองรถคันนี้
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
          ${availableCars.length === 0 ? '<p class="text-center text-gray-500 py-12">ขณะนี้ไม่มีรถว่าง</p>' : ''}
        </section>

        <!-- Footer -->
        <footer class="bg-white border-t mt-12">
          <div class="max-w-7xl mx-auto px-4 py-8 text-center text-gray-500 text-sm">
            <p>© ${new Date().getFullYear()} ${settings.companyName} - ระบบจองเช่ารถ</p>
            <p class="mt-1">ติดต่อ: ${settings.contactPhone} | ${settings.contactEmail}</p>
          </div>
        </footer>

        <!-- Booking Modal -->
        <div id="booking-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
              <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold" id="modal-title">จองรถ</h3>
                <button onclick="closeBooking()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
              </div>
              <form id="booking-form" onsubmit="submitBooking(event)">
                <input type="hidden" id="car-id">
                <div class="mb-4">
                  <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                  <input type="text" id="customer-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                </div>
                <div class="mb-4">
                  <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์</label>
                  <input type="tel" id="customer-phone" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">วันที่รับรถ</label>
                    <input type="date" id="start-date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">วันที่คืนรถ</label>
                    <input type="date" id="end-date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none">
                  </div>
                </div>
                <div class="mb-4">
                  <label class="block text-sm font-medium text-gray-700 mb-1">หมายเหตุ (ถ้ามี)</label>
                  <textarea id="customer-note" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none"></textarea>
                </div>
                <div id="price-preview" class="bg-blue-50 rounded-lg p-3 mb-4 text-sm hidden">
                  <p>จำนวนวัน: <span id="days-count" class="font-semibold">-</span></p>
                  <p>ราคารวมโดยประมาณ: <span id="total-price" class="font-bold text-primary">-</span></p>
                </div>
                <button type="submit" class="w-full btn-primary text-white py-3 rounded-xl font-medium">ยืนยันการจอง</button>
              </form>
            </div>
          </div>
        </div>

        <!-- Success Modal -->
        <div id="success-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full p-6 text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <span class="text-3xl">✅</span>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">จองสำเร็จ!</h3>
            <p class="text-gray-600 mb-6 text-sm">ข้อมูลการจองของคุณได้รับการบันทึกแล้ว กรุณาแจ้งเจ้าของรถผ่านช่องทางด้านล่าง</p>
            <div class="space-y-3" id="notify-links">
              <!-- Links will be inserted -->
            </div>
            <button onclick="closeSuccess()" class="mt-6 text-gray-500 hover:text-gray-700 text-sm">ปิด</button>
          </div>
        </div>
      `;

      // Set min date to today
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('start-date').min = today;
      document.getElementById('end-date').min = today;

      // Price preview listeners
      ['start-date', 'end-date'].forEach(id => {
        document.getElementById(id).addEventListener('change', updatePricePreview);
      });
    }

    let selectedCarId = null;

    function openBooking(carId) {
      selectedCarId = carId;
      const car = cars.find(c => c.id === carId);
      document.getElementById('car-id').value = carId;
      document.getElementById('modal-title').textContent = `จอง ${car.name}`;
      document.getElementById('booking-form').reset();
      document.getElementById('price-preview').classList.add('hidden');
      document.getElementById('booking-modal').classList.remove('hidden');
      document.getElementById('booking-modal').classList.add('flex');
    }

    function closeBooking() {
      document.getElementById('booking-modal').classList.add('hidden');
      document.getElementById('booking-modal').classList.remove('flex');
    }

    function updatePricePreview() {
      const start = document.getElementById('start-date').value;
      const end = document.getElementById('end-date').value;
      if (start && end && selectedCarId) {
        const car = cars.find(c => c.id === selectedCarId);
        const days = calculateDays(start, end);
        const total = days * car.price;
        document.getElementById('days-count').textContent = days + ' วัน';
        document.getElementById('total-price').textContent = total.toLocaleString('th-TH') + ' บาท';
        document.getElementById('price-preview').classList.remove('hidden');
      }
    }

    function submitBooking(e) {
      e.preventDefault();
      const carId = parseInt(document.getElementById('car-id').value);
      const car = cars.find(c => c.id === carId);
      
      const booking = {
        id: Date.now(),
        carId: carId,
        name: document.getElementById('customer-name').value,
        phone: document.getElementById('customer-phone').value,
        startDate: document.getElementById('start-date').value,
        endDate: document.getElementById('end-date').value,
        note: document.getElementById('customer-note').value,
        createdAt: new Date().toISOString(),
        status: 'pending'
      };

      bookings.push(booking);
      saveData();

      // Generate notification links
      const message = generateNotifyMessage(booking, car);
      const lineLink = getLineLink(message);
      const waLink = getWhatsAppLink(settings.ownerWhatsApp, message);

      document.getElementById('notify-links').innerHTML = `
        <a href="${lineLink}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-medium transition">
          <span>💬</span> แจ้งผ่าน LINE
        </a>
        <a href="${waLink}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-medium transition">
          <span>📱</span> แจ้งผ่าน WhatsApp
        </a>
      `;

      closeBooking();
      document.getElementById('success-modal').classList.remove('hidden');
      document.getElementById('success-modal').classList.add('flex');
    }

    function closeSuccess() {
      document.getElementById('success-modal').classList.add('hidden');
      document.getElementById('success-modal').classList.remove('flex');
    }

    // Init
    renderApp();
  </script>
</body>
</html>
